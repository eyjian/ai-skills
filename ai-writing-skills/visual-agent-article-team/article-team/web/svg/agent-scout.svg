<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 70">
  <!-- scout 侦察员：绿色系，贝雷帽 -->
  <g class="body">
    <rect x="18" y="38" width="24" height="28" rx="6" fill="#10B981"/>
    <rect x="20" y="40" width="20" height="8" rx="3" fill="#059669"/>
  </g>
  <g class="head">
    <circle cx="30" cy="22" r="14" fill="#fdd9b5"/>
    <!-- 贝雷帽 -->
    <ellipse cx="30" cy="12" rx="16" ry="8" fill="#059669"/>
    <circle cx="30" cy="8" r="3" fill="#047857"/>
    <!-- 眼睛 -->
    <circle cx="24" cy="22" r="2" fill="#333"/>
    <circle cx="36" cy="22" r="2" fill="#333"/>
    <!-- 微笑 -->
    <path d="M25 28 Q30 32, 35 28" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- 放大镜 -->
  <g class="accessory">
    <circle cx="48" cy="42" r="8" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <line x1="54" y1="48" x2="58" y2="54" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="42" r="5" fill="rgba(16,185,129,0.15)"/>
  </g>
</svg>
