<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 70">
  <!-- polisher 润色师：黄色系，围裙 -->
  <g class="body">
    <rect x="18" y="38" width="24" height="28" rx="6" fill="#EAB308"/>
    <!-- 围裙 -->
    <path d="M20 44 L20 62 Q30 66, 40 62 L40 44 Z" fill="#CA8A04" opacity="0.7"/>
    <rect x="26" y="48" width="8" height="6" rx="1" fill="#A16207" opacity="0.5"/>
  </g>
  <g class="head">
    <circle cx="30" cy="22" r="14" fill="#fdd9b5"/>
    <!-- 头发（短卷发） -->
    <circle cx="20" cy="14" r="5" fill="#6b4423"/>
    <circle cx="30" cy="11" r="5" fill="#6b4423"/>
    <circle cx="40" cy="14" r="5" fill="#6b4423"/>
    <circle cx="24" cy="12" r="4" fill="#7a5230"/>
    <circle cx="36" cy="12" r="4" fill="#7a5230"/>
    <!-- 眼睛（友善） -->
    <circle cx="24" cy="22" r="2" fill="#333"/>
    <circle cx="36" cy="22" r="2" fill="#333"/>
    <circle cx="25" cy="21" r="0.6" fill="#fff"/>
    <circle cx="37" cy="21" r="0.6" fill="#fff"/>
    <!-- 笑 -->
    <path d="M24 28 Q30 34, 36 28" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- 喷壶/闪光 -->
  <g class="accessory">
    <rect x="46" y="40" width="8" height="14" rx="2" fill="#EAB308"/>
    <line x1="50" y1="38" x2="50" y2="40" stroke="#EAB308" stroke-width="2"/>
    <line x1="48" y1="36" x2="50" y2="38" stroke="#EAB308" stroke-width="1.5"/>
    <line x1="52" y1="36" x2="50" y2="38" stroke="#EAB308" stroke-width="1.5"/>
    <!-- 闪光 -->
    <text x="44" y="34" font-size="10" fill="#EAB308">✨</text>
  </g>
</svg>
