<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 70">
  <!-- reviewer 审稿人：红色系，红围巾 -->
  <g class="body">
    <rect x="18" y="38" width="24" height="28" rx="6" fill="#EF4444"/>
    <rect x="20" y="40" width="20" height="8" rx="3" fill="#DC2626"/>
  </g>
  <g class="head">
    <circle cx="30" cy="22" r="14" fill="#fdd9b5"/>
    <!-- 头发 -->
    <path d="M16 18 Q18 8, 30 10 Q42 8, 44 18" fill="#5c3a1e" stroke="none"/>
    <!-- 眼睛（严肃） -->
    <line x1="22" y1="20" x2="27" y2="20" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="20" x2="38" y2="20" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <circle cx="24.5" cy="22" r="1.5" fill="#333"/>
    <circle cx="35.5" cy="22" r="1.5" fill="#333"/>
    <!-- 嘴（严肃） -->
    <line x1="26" y1="29" x2="34" y2="29" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- 红围巾 -->
  <g class="accessory">
    <path d="M18 36 Q22 34, 30 36 Q38 34, 42 36 L40 42 Q30 40, 20 42 Z" fill="#DC2626"/>
    <path d="M28 42 L26 56" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 42 L34 54" stroke="#B91C1C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 红笔 -->
  <g class="right-arm">
    <line x1="46" y1="40" x2="54" y2="56" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="54" cy="57" r="1.5" fill="#DC2626"/>
  </g>
</svg>
