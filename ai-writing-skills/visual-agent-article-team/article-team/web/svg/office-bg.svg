<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 地板 -->
  <rect width="800" height="500" fill="#252750" rx="12"/>
  <!-- 地板网格 -->
  <g opacity="0.08" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <!-- 窗户 -->
  <g>
    <rect x="60" y="20" width="100" height="50" rx="4" fill="#1a1b2e" stroke="#404370" stroke-width="1"/>
    <rect x="65" y="25" width="42" height="40" rx="2" fill="#1e2040"/>
    <rect x="113" y="25" width="42" height="40" rx="2" fill="#1e2040"/>
    <rect x="300" y="20" width="100" height="50" rx="4" fill="#1a1b2e" stroke="#404370" stroke-width="1"/>
    <rect x="305" y="25" width="42" height="40" rx="2" fill="#1e2040"/>
    <rect x="353" y="25" width="42" height="40" rx="2" fill="#1e2040"/>
    <rect x="600" y="20" width="100" height="50" rx="4" fill="#1a1b2e" stroke="#404370" stroke-width="1"/>
    <rect x="605" y="25" width="42" height="40" rx="2" fill="#1e2040"/>
    <rect x="653" y="25" width="42" height="40" rx="2" fill="#1e2040"/>
  </g>
  <!-- 植物 -->
  <g transform="translate(30, 380)">
    <rect x="8" y="30" width="14" height="20" rx="2" fill="#3a3c60"/>
    <ellipse cx="15" cy="28" rx="12" ry="14" fill="#10B981" opacity="0.6"/>
    <ellipse cx="10" cy="22" rx="8" ry="10" fill="#10B981" opacity="0.7"/>
  </g>
  <!-- 时钟 -->
  <g transform="translate(750, 30)">
    <circle cx="15" cy="15" r="14" fill="#1a1b2e" stroke="#404370" stroke-width="1"/>
    <line x1="15" y1="15" x2="15" y2="6" stroke="#a0a3bd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="15" x2="22" y2="15" stroke="#a0a3bd" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
